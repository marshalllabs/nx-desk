repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
      # Formatting can split a bracket over lines, which COM812 then gives a trailing comma.
      - id: ruff-check
        name: ruff trailing commas
        args: [--fix, --select, COM812]
      - id: ruff-format
        name: ruff format again
